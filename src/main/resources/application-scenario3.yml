# 场景三：max.poll.records 较大，但整体配置"看起来合理"
# （10 条 * 200ms 正常处理 = 2000ms，远小于 8000ms 阈值）。
#
# 但由于配置了阻塞式重试（DefaultErrorHandler + FixedBackOff），一旦某条消息
# 处理失败触发重试，DefaultErrorHandler 的单次重试等待时间（9000ms）本身就
# 超过了 max.poll.interval.ms（8000ms）——即便重试之间会重新调用 poll()，
# 距离上一次成功 poll() 的间隔也已经超时，同样会触发 rebalance。
#
# 关键点：这不是"总耗时累加"，而是"单次等待就超标"。session.timeout.ms
# 也相应调大，避免因心跳线程本身受阻（本场景不涉及）而误报。
spring:
  kafka:
    consumer:
      properties:
        max.poll.interval.ms: 8000
        max.poll.records: 10
        session.timeout.ms: 12000
        heartbeat.interval.ms: 3000
