server:
  port: 8080

app:
  kafka:
    topic: slow-events
    other-topic: other-events

spring:
  application:
    name: kafka-rebalance-demo
  # 默认激活场景一；可通过 --spring.profiles.active=scenario2 / scenario3 / scenario4 / scenario5 / scenario6 切换
  profiles:
    active: scenario1
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
    consumer:
      group-id: slow-consumer-group
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.example.kafkarebalance.model"
        spring.json.value.default.type: "com.example.kafkarebalance.model.DemoEvent"
    listener:
      ack-mode: manual_immediate
      concurrency: 1
